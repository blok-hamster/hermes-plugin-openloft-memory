name: openloft-memory
version: "0.1.0"
homepage: "https://github.com/blok-hamster/hermes-plugin-openloft-memory"
description: "OpenLoft Memory — persistent, graph-backed long-term memory for any Hermes agent. Recall before every turn, ingest after every turn, loft_* memory tools."
author: OpenLoft
license: MIT
tags:
  - memory
  - provider
requires_env:
  - name: OPENLOFT_MEMORY_API_KEY
    description: "OpenLoft memory key. Mint one from the dashboard (Memory > Connections), or self-host the memory service."
    url: "https://www.openloft.xyz/memory/connections"
    secret: true
hooks:
  - prefetch
  - queue_prefetch
  - sync_turn
# Rule 14 (compatibility truth): requires_hermes SemVer floor declared in BOTH
# this manifest and the catalog entry. Measured on Hermes v0.19.0 — plugin
# loads, registers, and passes full E2E (remember → recall → forget → recall
# empty) on that version.
requires_hermes: ">=0.19.0"
